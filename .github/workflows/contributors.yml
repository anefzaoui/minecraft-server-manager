name: Contributors strip

# Keeps docs/images/contributors.svg (the avatar strip in the README) in step
# with the repository's contributor list.
#
# It opens a pull request rather than pushing, because `main` is protected and
# every change lands through review. The generator only needs Node builtins, so
# there is no install step. Run it locally any time with `pnpm run contributors`.
on:
  schedule:
    # 05:17 UTC on the 1st of each month. An odd minute keeps it off the hour,
    # when GitHub's scheduler queue is at its longest.
    - cron: '17 5 1 * *'
  workflow_dispatch:

concurrency:
  group: contributors-strip
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # pushes the branch the PR is opened from
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Regenerate the strip
        env:
          GITHUB_TOKEN: ${{ github.token }} # lifts the unauthenticated API rate limit
        run: node scripts/contributors-svg.js

      - name: Open a pull request when it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/images/contributors.svg; then
            echo "No change; nothing to open."
            exit 0
          fi

          branch="chore/contributors-strip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add docs/images/contributors.svg
          git commit -m "chore(readme): refresh the contributors strip"
          git push --force-with-lease origin "$branch"

          # One rolling PR: reuse the open one if the previous refresh's is still
          # unmerged, so a quiet month never leaves a stack of identical PRs.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(readme): refresh the contributors strip" \
              --body "New or changed avatars in \`docs/images/contributors.svg\`, regenerated by the monthly Contributors strip workflow. Nothing else in the repository is touched."
          else
            echo "Updated the branch behind the open pull request."
          fi
